[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "saudi-guard-research"
version = "0.1.0"
description = "SAUDI-Guard research code for Arabic mobile application security"
requires-python = ">=3.10"
dependencies = ["openai>=1.0", "pandas>=2.0", "scikit-learn>=1.3", "jsonlines>=4.0", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["src"]
